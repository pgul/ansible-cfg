---
# Main playbook. Roles are added here as they become ready.
# Run: make check   (changes nothing)  →  make apply
- name: Base server configuration
  hosts: all
  become: true
  gather_facts: true
  roles:
    # users comes first: everything else assumes the admin user and their sudo
    # are already in the expected state.
    - users
    - common
    - local_scripts
    - role: zabbix_agent
      when: zabbix_agent_manage | bool
    - role: mariadb
      when: mariadb_manage | bool

# The firewall gets a play of its own, one host at a time, aborting the whole
# run on the first failure. A mistake here costs access to the host, so the
# blast radius is kept to a single machine.
- name: Firewall
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - role: firewall
      when: firewall_manage | bool
