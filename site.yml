---
# Главный плейбук. Роли добавляем сюда по мере готовности.
# Запуск: make check   (ничего не меняет)  →  make apply
- name: Базовая конфигурация серверов
  hosts: all
  become: true
  gather_facts: true
  roles:
    # users идёт первой: всё остальное опирается на то, что админский
    # пользователь и его sudo уже в нужном состоянии.
    - users
    - common
    - role: zabbix_agent
      when: zabbix_agent_manage | bool
