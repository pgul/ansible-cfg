---
# Main playbook. Roles are added here as they become ready.
# Run: make check   (changes nothing)  →  make apply
- name: Base server configuration
  hosts: all
  become: true
  gather_facts: true
  roles:
    # users comes first: everything else assumes the admin user and their sudo
    # are already in the expected state.
    - users
    - common
    - local_scripts
    - role: zabbix_agent
      when: zabbix_agent_manage | bool
