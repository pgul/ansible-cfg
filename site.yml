---
# Main playbook. Roles are added here as they become ready.
# Run: make check   (changes nothing)  →  make apply
- name: Base server configuration
  hosts: all
  become: true
  gather_facts: true
  roles:
    # users comes first: everything else assumes the admin user and their sudo
    # are already in the expected state.
    - users
    - role: dotfiles
      when: dotfiles_manage | bool
    - common
    - local_scripts
    - role: zabbix_agent
      when: zabbix_agent_manage | bool
    - role: mariadb
      when: mariadb_manage | bool
    - role: bitcoin
      when: bitcoin_manage | bool

# Anything that can cost us access to the host goes here: one machine at a
# time, aborting the whole run on the first failure, so a mistake reaches one
# server instead of six. sshd decides who may log in, udp-link carries every
# session (ProxyCommand in ~/.ssh/config), and the firewall decides whether ssh
# is reachable at all.
- name: Access-critical roles
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - role: sshd
      when: sshd_manage | bool
    - role: udp_link
      when: udp_link_manage | bool
    - role: firewall
      when: firewall_manage | bool
