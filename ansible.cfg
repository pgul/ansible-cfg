[defaults]
inventory        = inventory/hosts.yml
roles_path       = roles
collections_path = collections

# Readable output: task results as YAML rather than one long JSON line.
result_format     = yaml
callbacks_enabled = ansible.posix.profile_tasks

# Don't let Ansible silently guess the interpreter or spam warnings about it.
interpreter_python = auto_silent

# Facts are available only as ansible_facts.<name>, never as top-level
# ansible_<name>. This becomes the default in ansible-core 2.24; enabling it
# early means the deprecated form fails now instead of quietly turning into
# undefined later.
inject_facts_as_vars = False

host_key_checking  = True
retry_files_enabled = False
forks = 10

# Uncomment once a vault exists (keep the password file OUTSIDE the repo):
# vault_password_file = ~/.ansible/vault-pass-ansible-cfg

[privilege_escalation]
# Don't escalate by default: become is enabled explicitly in plays, so a stray
# ad-hoc command can't run as root.
become        = False
become_method = sudo

[ssh_connection]
# ControlPersist reuses one connection, which makes a run several times faster.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
