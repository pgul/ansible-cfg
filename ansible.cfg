[defaults]
inventory        = inventory/hosts.yml
roles_path       = roles
collections_path = collections

# Читаемый вывод: результаты задач как YAML, а не как одна длинная строка JSON.
result_format     = yaml
callbacks_enabled = ansible.posix.profile_tasks

# Не давать Ansible молча гадать про интерпретатор и не спамить предупреждениями.
interpreter_python = auto_silent
host_key_checking  = True
retry_files_enabled = False
forks = 10

# Раскомментировать, когда появится vault (файл держать ВНЕ репозитория):
# vault_password_file = ~/.ansible/vault-pass-ansible-cfg

[privilege_escalation]
# По умолчанию не повышаем права: become включаем явно в плеях/задачах,
# чтобы случайный ad-hoc не выполнился от root.
become        = False
become_method = sudo

[ssh_connection]
# ControlPersist переиспользует одно соединение — прогон ускоряется в разы.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
