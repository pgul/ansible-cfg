---
# Reconnaissance: changes nothing, just shows what machines we have.
- name: Gather host facts
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Show summary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
          ({{ ansible_facts.os_family }}),
          kernel {{ ansible_facts.kernel }},
          {{ ansible_facts.processor_vcpus }} vCPU,
          {{ (ansible_facts.memtotal_mb / 1024) | round(1) }} GiB RAM,
          python {{ ansible_facts.python_version }}
