---
# Одноразовая подготовка хоста. Два случая:
#
# 1. Совсем новый сервер, где пользователя gul ещё нет. Ansible пока не может
#    ходить туда как gul, поэтому подключаемся root'ом:
#       make bootstrap HOSTS=newhost REMOTE_USER=root
#    После этого обычный `make apply HOSTS=newhost` уже работает как gul.
#
# 2. Fedora, где модулю dnf не хватает биндингов (см. задачу ниже):
#       make bootstrap HOSTS=happy
#
# Это НЕ часть site.yml намеренно: здесь есть задача, которую нельзя выполнить
# в check-режиме, а site.yml должен оставаться пригодным для честного --check.
- name: Подготовить хост к управлению Ansible
  hosts: all
  become: true
  gather_facts: true

  roles:
    # Чтобы на новом сервере появился gul с ключом и беспарольным sudo.
    # Роль идемпотентна, так что на уже настроенном хосте это пустой прогон.
    - users

  tasks:
    # На Fedora 41+ пакетный менеджер — dnf5, и модуль dnf ходит в него через
    # python3-libdnf5. В обычном прогоне модуль доставит биндинги сам, но в
    # check-режиме не может — и весь прогон падает на первом же хосте.
    - name: Установить python3-libdnf5 (биндинги dnf5 для модуля dnf)
      ansible.builtin.raw: rpm -q python3-libdnf5 || dnf -y install python3-libdnf5
      register: bootstrap_libdnf5
      changed_when: "'Complete!' in bootstrap_libdnf5.stdout"
      when: ansible_facts.os_family == 'RedHat'
