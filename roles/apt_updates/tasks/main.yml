---
- name: Install the packages the scripts call
  ansible.builtin.apt:
    name: "{{ apt_updates_packages }}"
    state: present

- name: Install the check scripts into {{ apt_updates_bin_dir }}
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ apt_updates_bin_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ apt_updates_scripts }}"

# No handler: cron watches /etc/cron.d itself and picks up the new file within
# a minute.
- name: Install the cron schedule
  ansible.builtin.template:
    src: apt-updates.cron.j2
    dest: "{{ apt_updates_cron_file }}"
    owner: root
    group: root
    mode: "0644"
