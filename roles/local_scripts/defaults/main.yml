---
# Scripts from files/bin/ that must be present on every host.
# The role is deliberately separate rather than part of zabbix_agent: that role
# is disabled on happy, and the scripts are needed there too.
local_scripts_dir: /usr/local/bin
local_scripts_files:
  - zbx-chain-checkpoint
  - zbx-crypto-rpc

# Scripts from files/bin/ that only some hosts need. Set in host_vars; the role
# installs the union of both lists. blockchain-sql, for instance, is only
# useful where the qbitcoin database lives (oc, node).
local_scripts_extra_files: []
