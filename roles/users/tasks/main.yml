---
- name: Убедиться, что существует группа {{ users_admin_group }}
  ansible.builtin.group:
    name: "{{ users_admin_group }}"
    state: present
    system: true

- name: Завести пользователя {{ users_admin_name }}
  ansible.builtin.user:
    name: "{{ users_admin_name }}"
    comment: "{{ users_admin_comment }}"
    shell: "{{ users_admin_shell }}"
    groups: "{{ users_admin_group }}"
    # append, а не замена: на хостах он состоит ещё в docker, archiver и прочих
    # группах, которые роль знать не обязана.
    append: true
    # Пароль не трогаем вообще: вход только по ключу, а сброс пароля
    # у существующего пользователя мог бы его заблокировать.
    state: present

- name: Разложить ssh-ключи
  ansible.posix.authorized_key:
    user: "{{ users_admin_name }}"
    key: "{{ lookup('ansible.builtin.file', 'authorized_keys/' + item) }}"
    state: present
    exclusive: false
  loop: "{{ users_admin_authorized_keys }}"

# Файл в /etc/sudoers.d действует только если основной sudoers подключает
# каталог. У этой директивы две равноправные формы: старая «#includedir»
# (решётка здесь НЕ комментарий — так исторически сделано в sudo) и новая
# «@includedir». Их легко перепутать с закомментированной строкой и
# «исправить» в неработающий вид, поэтому роль ничего не правит, а только
# проверяет — и падает громко, если подключения нет.
- name: Проверить, что /etc/sudoers подключает каталог sudoers.d
  ansible.builtin.command: grep -Eq '^[#@]includedir[[:space:]]+/etc/sudoers\.d' /etc/sudoers
  changed_when: false
  register: users_includedir
  failed_when: users_includedir.rc != 0
  # Задача только читает файл, поэтому выполняется и в check-режиме: иначе
  # command пропускался бы, и --check не поймал бы отсутствие подключения.
  check_mode: false
  when: users_manage_sudoers | bool

- name: Положить правило беспарольного sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ users_sudoers_file }}"
    content: |
      # Управляется Ansible (roles/users). Правки руками будут затёрты.
      {% for rule in users_sudoers_rules %}
      {{ rule }}
      {% endfor %}
    owner: root
    group: root
    mode: "0440"
    # Без validate опечатка здесь лишает sudo всех сразу, а хост доступен
    # только по ssh. visudo -cf проверяет файл ДО того, как он встанет на место.
    validate: visudo -cf %s
  when: users_manage_sudoers | bool

- name: Убрать исторические дубли того же правила
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item }}"
    state: absent
  loop: "{{ users_sudoers_obsolete }}"
  when:
    - users_manage_sudoers | bool
    - item != users_sudoers_file
