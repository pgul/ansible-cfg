---
- name: Ensure admin group exists — {{ users_admin_group }}
  ansible.builtin.group:
    name: "{{ users_admin_group }}"
    state: present
    system: true

- name: Create user {{ users_admin_name }}
  ansible.builtin.user:
    name: "{{ users_admin_name }}"
    comment: "{{ users_admin_comment }}"
    shell: "{{ users_admin_shell }}"
    groups: "{{ users_admin_group }}"
    # append, not replace: on these hosts the user also belongs to docker,
    # archiver and other groups the role has no business knowing about.
    append: true
    # The password is left alone entirely: login is by key only, and resetting
    # the password of an existing user could lock them out.
    state: present

- name: Install ssh keys
  ansible.posix.authorized_key:
    user: "{{ users_admin_name }}"
    key: "{{ lookup('ansible.builtin.file', 'authorized_keys/' + item) }}"
    state: present
    exclusive: false
  loop: "{{ users_admin_authorized_keys }}"

# A file under /etc/sudoers.d only takes effect if the main sudoers includes the
# directory. That directive has two equally valid forms: the old "#includedir"
# (the hash is NOT a comment here — that is how sudo has always spelled it) and
# the new "@includedir". They are easy to mistake for a commented-out line and
# "fix" into something that does not work, so the role changes nothing and only
# checks — failing loudly if the include is missing.
- name: Check that /etc/sudoers includes the sudoers.d directory
  ansible.builtin.command: grep -Eq '^[#@]includedir[[:space:]]+/etc/sudoers\.d' /etc/sudoers
  changed_when: false
  register: users_includedir
  failed_when: users_includedir.rc != 0
  # This task only reads the file, so it runs in check mode too: otherwise
  # command would be skipped and --check would miss a missing include.
  check_mode: false
  when: users_manage_sudoers | bool

- name: Install the passwordless sudo rule
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ users_sudoers_file }}"
    content: |
      # Managed by Ansible (roles/users). Manual edits will be overwritten.
      {% for rule in users_sudoers_rules %}
      {{ rule }}
      {% endfor %}
    owner: root
    group: root
    mode: "0440"
    # Without validate a typo here takes sudo away from everyone at once, on a
    # host reachable only over ssh. visudo -cf checks the file BEFORE it lands.
    validate: visudo -cf %s
  when: users_manage_sudoers | bool

- name: Remove historical duplicates of the same rule
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item }}"
    state: absent
  loop: "{{ users_sudoers_obsolete }}"
  when:
    - users_manage_sudoers | bool
    - item != users_sudoers_file
