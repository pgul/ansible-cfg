---
# Installing iptables-persistent asks debconf whether to save the current rules.
# Preseeding keeps a new server from hanging on that prompt.
- name: Preseed iptables-persistent so it does not prompt
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item }}"
    vtype: boolean
    value: "false"
  loop:
    - iptables-persistent/autosave_v4
    - iptables-persistent/autosave_v6

- name: Install iptables-persistent
  ansible.builtin.package:
    name: iptables-persistent
    state: present

# The unit restores rules.v4 and rules.v6 alike, so IPv6 needs nothing extra
# here to survive a reboot.
- name: Restore the saved rules at boot
  ansible.builtin.systemd_service:
    name: netfilter-persistent
    enabled: true

# NOT stopped, only disabled. The unit's ExecStop is "nft flush ruleset", and
# iptables-nft rules live in the same engine — stopping it would drop the whole
# firewall, ssh redirect included. Disabling is enough: it is a oneshot unit
# that has already run, and it will not run again after a reboot.
- name: Keep nftables.service from running at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: false
  when: firewall_disable_nftables_service | bool
  failed_when: false

- name: Render the ruleset
  ansible.builtin.template:
    src: rules.v4.j2
    dest: "{{ firewall_rules_file }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
    # Catches syntax errors before the file lands. It does NOT catch a rule set
    # that is valid but locks us out — that is what the rollback below is for.
    validate: iptables-restore --test %s
  register: firewall_rules

- name: Render the IPv6 ruleset
  ansible.builtin.template:
    src: rules.v6.j2
    dest: "{{ firewall_v6_rules_file }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
    validate: ip6tables-restore --test %s
  register: firewall_v6_rules
  when: firewall_v6_manage | bool

# Both files are loaded in one pass, so one flag decides whether the pass runs.
- name: Note whether either ruleset changed
  ansible.builtin.set_fact:
    firewall_reload: "{{ firewall_rules is changed or firewall_v6_rules is changed }}"

# The tasks below are deliberately not handlers, despite "when: firewall_reload".
# Handlers run at the end of the play, but the whole point here is the order:
# arm the rollback, load the rules, prove ssh still works, only then disarm.
- name: Snapshot the live rulesets and arm the rollback
  ansible.builtin.shell:
    cmd: |
      set -eu
      iptables-save > {{ firewall_rollback_rules }}
      ip6tables-save > {{ firewall_v6_rollback_rules }}
      rm -f {{ firewall_rollback_ok }}
      setsid sh -c 'sleep {{ firewall_rollback_seconds }}
        if [ ! -e {{ firewall_rollback_ok }} ]; then
          iptables-restore < {{ firewall_rollback_rules }}
      {% if firewall_rules.backup_file is defined and firewall_rules.backup_file %}
          cp {{ firewall_rules.backup_file }} {{ firewall_rules_file }}
      {% endif %}
          if [ -s {{ firewall_v6_rollback_rules }} ]; then
            ip6tables-restore < {{ firewall_v6_rollback_rules }}
          else
            ip6tables -F
            ip6tables -t nat -F
            ip6tables -P INPUT ACCEPT
            ip6tables -P FORWARD ACCEPT
            ip6tables -P OUTPUT ACCEPT
          fi
      {% if firewall_v6_rules.backup_file is defined and firewall_v6_rules.backup_file %}
          cp {{ firewall_v6_rules.backup_file }} {{ firewall_v6_rules_file }}
      {% endif %}
        fi
        rm -f {{ firewall_rollback_rules }} {{ firewall_v6_rollback_rules }} {{ firewall_rollback_ok }}' </dev/null >/dev/null 2>&1 &
  changed_when: true
  when: firewall_reload | bool

# Note the empty-snapshot branch above: on a host that has never had a v6
# ruleset, ip6tables-save prints nothing, and there is no "previous file" to
# put back. Restoring that emptiness literally is impossible, so the rollback
# reproduces what it meant in practice — no tables, everything through.

- name: Load the new ruleset
  ansible.builtin.command: "iptables-restore {{ firewall_rules_file }}"
  changed_when: true
  when: firewall_reload | bool

- name: Load the new IPv6 ruleset
  ansible.builtin.command: "ip6tables-restore {{ firewall_v6_rules_file }}"
  changed_when: true
  when:
    - firewall_reload | bool
    - firewall_v6_manage | bool

# The ssh control socket is kept open by ControlPersist, so an existing session
# survives even a ruleset that blocks new connections. Dropping it forces the
# next task to dial in again, which is the only honest test.
- name: Drop the ssh control connection
  ansible.builtin.meta: reset_connection

- name: Prove that a new ssh connection still works
  ansible.builtin.ping:

- name: Disarm the rollback
  ansible.builtin.file:
    path: "{{ firewall_rollback_ok }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
  when: firewall_reload | bool

# Enumerating every unit takes over a minute per host, and the only consumer is
# the fail2ban restart below, which matters only when the ruleset changed.
- name: Collect service facts
  ansible.builtin.service_facts:
  when: firewall_reload | bool

# Only needed when fail2ban bans through an iptables action, in which case
# loading a ruleset removes its f2b-* chains and it re-creates them on start.
# On us and oc it currently bans through nftables instead, into its own
# "inet f2b-table", which iptables-restore does not touch — so this restart is
# a no-op there. Kept anyway: the banaction is a fail2ban setting this role
# does not control, and bans survive the restart via its sqlite database.
- name: Restart fail2ban so it re-creates its chains
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when:
    - firewall_reload | bool
    - "'fail2ban.service' in ansible_facts.services | default({})"
