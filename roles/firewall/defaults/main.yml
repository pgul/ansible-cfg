---
# Turned off on hosts whose ruleset is not ours to own: happy (hand-tuned) and
# spelik (Docker writes rules at runtime, and a static restore would wipe them).
firewall_manage: true

firewall_rules_file: /etc/iptables/rules.v4

# --- Policies ---
firewall_input_policy: DROP
firewall_forward_policy: DROP
firewall_output_policy: ACCEPT

# --- ssh ---
# Both ports are accepted in filter; the nat rules below are what actually make
# 922 work. Get those wrong and the host is unreachable — see the rollback.
firewall_ssh_ports: [22, 922]

# --- Zabbix ---
firewall_zabbix_agent_port: 10050
firewall_zabbix_agent_sources:
  - 213.133.161.33     # happy
  - 213.133.164.6      # its.happy.kiev.ua
  - 91.225.123.133     # osokorki.happy.kiev.ua
  - 129.159.205.15     # oc / zabbix.spelik.com
# Only for hosts that are Zabbix servers themselves.
firewall_zabbix_server_port: 10051
firewall_zabbix_server_sources: []

# --- Per-host openings ---
firewall_tcp_ports: []
firewall_udp_ports: []
firewall_udp_port_ranges: []

# Verbatim rule bodies, appended after everything above and before the final
# REJECT. Written without the leading "-A INPUT".
firewall_extra_input_rules: []
firewall_forward_rules: []

# Extra chains as "name: [rule bodies]". Used for Oracle's InstanceServices.
firewall_extra_chains: {}

# --- nat ---
# The default pair is what ho and node use: 922 is redirected to sshd, and a
# direct connection to 22 is sent to a dead port. Hosts that need to match on a
# destination address override this.
firewall_nat_prerouting_rules:
  - '-p tcp -m tcp --dport 22 -j REDIRECT --to-ports 1'
  - '-p tcp -m tcp --dport 922 -j REDIRECT --to-ports 22'
firewall_nat_postrouting_rules: []

# --- Rollback ---
# After loading a new ruleset the role forces a fresh ssh connection. If that
# connection cannot be made, this timer restores the previous ruleset and the
# previous file, so a mistake costs minutes rather than a console session.
firewall_rollback_seconds: 300
firewall_rollback_rules: /run/firewall-rollback.v4
firewall_rollback_ok: /run/firewall-rollback.ok

# nftables.service and iptables-persistent write into the same engine, and
# /etc/nftables.conf begins with "flush ruleset". On ho both were enabled, and
# the firewall survived boot only because the services happened to start in a
# lucky order.
firewall_disable_nftables_service: true
