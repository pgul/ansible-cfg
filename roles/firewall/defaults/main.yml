---
# Turned off on hosts whose ruleset is not ours to own: happy (hand-tuned) and
# spelik (Docker writes rules at runtime, and a static restore would wipe them).
firewall_manage: true

firewall_rules_file: /etc/iptables/rules.v4

# --- Policies ---
firewall_input_policy: DROP
firewall_forward_policy: DROP
firewall_output_policy: ACCEPT

# --- ssh ---
# Both ports are accepted in filter; the nat rules below are what actually make
# 922 work. Get those wrong and the host is unreachable — see the rollback.
firewall_ssh_ports: [22, 922]

# --- Zabbix ---
firewall_zabbix_agent_port: 10050
firewall_zabbix_agent_sources:
  - 213.133.161.33     # happy
  - 213.133.164.6      # its.happy.kiev.ua
  - 91.225.123.133     # osokorki.happy.kiev.ua
  - 129.159.205.15     # oc / zabbix.spelik.com
# Only for hosts that are Zabbix servers themselves.
firewall_zabbix_server_port: 10051
firewall_zabbix_server_sources: []

# --- Per-host openings ---
# Ports open to everyone.
firewall_tcp_ports: []

# Ports open only to named sources, as "port: [addresses]". Each address gets
# its own ACCEPT and everything else falls through to the REJECT at the end —
# so a port listed here is closed to the rest of the internet, which is the
# whole point. Do not also list such a port in firewall_tcp_ports: the blanket
# rule sits later in the chain, but ACCEPT is ACCEPT and it would open it.
firewall_restricted_tcp_ports: {}
firewall_udp_ports: []
firewall_udp_port_ranges: []

# Verbatim rule bodies, appended after everything above and before the final
# REJECT. Written without the leading "-A INPUT".
firewall_extra_input_rules: []
firewall_forward_rules: []

# Extra chains as "name: [rule bodies]". Used for Oracle's InstanceServices.
firewall_extra_chains: {}

# --- nat ---
# The default pair is what ho and node use: 922 is redirected to sshd, and a
# direct connection to 22 is sent to a dead port. Hosts that need to match on a
# destination address override this.
firewall_nat_prerouting_rules:
  - '-p tcp -m tcp --dport 22 -j REDIRECT --to-ports 1'
  - '-p tcp -m tcp --dport 922 -j REDIRECT --to-ports 22'
firewall_nat_postrouting_rules: []

# --- Rollback ---
# After loading a new ruleset the role forces a fresh ssh connection. If that
# connection cannot be made, this timer restores the previous ruleset and the
# previous file, so a mistake costs minutes rather than a console session.
firewall_rollback_seconds: 300
firewall_rollback_rules: /run/firewall-rollback.v4
firewall_rollback_ok: /run/firewall-rollback.ok

# nftables.service and iptables-persistent write into the same engine, and
# /etc/nftables.conf begins with "flush ruleset". On ho both were enabled, and
# the firewall survived boot only because the services happened to start in a
# lucky order.
firewall_disable_nftables_service: true

# ============================ IPv6 =========================================
# A second, independent ruleset in /etc/iptables/rules.v6. netfilter-persistent
# already restores that file at boot, so nothing extra is needed to make it
# survive a reboot.
#
# The port lists are deliberately NOT shared with v4. An address list written
# for v4 cannot appear in a v6 rule, and most services here answer on v4 only —
# so a host opens over IPv6 exactly what its firewall_v6_* variables name, and
# nothing more. The two exceptions below are access-critical and follow v4.

# Off only where ip6tables cannot work at all — a kernel booted with
# ipv6.disable=1 makes ip6tables-restore fail outright.
firewall_v6_manage: true

firewall_v6_rules_file: /etc/iptables/rules.v6

# --- Policies ---
firewall_v6_input_policy: DROP
firewall_v6_forward_policy: DROP
# Outgoing connections are allowed: OUTPUT is ACCEPT and the replies come back
# through the RELATED,ESTABLISHED rule at the top of INPUT.
firewall_v6_output_policy: ACCEPT

# --- ssh ---
# Follows v4: ssh must not depend on which stack the client happened to pick.
firewall_v6_ssh_ports: "{{ firewall_ssh_ports }}"

# --- Per-host openings ---
firewall_v6_tcp_ports: []

# As in v4, "port: [addresses]" — but each address carries its own prefix
# length, since a v6 host address is /128 and a v6 network is not.
firewall_v6_restricted_tcp_ports: {}
firewall_v6_udp_ports: []

# Follows v4 for the same reason as the ssh ports: this is udp-link's range,
# and every ssh session to these hosts goes through it. If the client resolves
# a host to its AAAA record, the ProxyCommand dials in over IPv6 — closing the
# range here would lock us out of exactly the hosts that do have IPv6.
firewall_v6_udp_port_ranges: "{{ firewall_udp_port_ranges }}"

firewall_v6_extra_input_rules: []
firewall_v6_forward_rules: []
firewall_v6_extra_chains: {}

# --- nat ---
firewall_v6_nat_prerouting_rules:
  - '-p tcp -m tcp --dport 22 -j REDIRECT --to-ports 1'
  - '-p tcp -m tcp --dport 922 -j REDIRECT --to-ports 22'
firewall_v6_nat_postrouting_rules: []

# --- Rollback ---
firewall_v6_rollback_rules: /run/firewall-rollback.v6
