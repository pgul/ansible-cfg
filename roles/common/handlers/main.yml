---
# cron кеширует таймзону при старте, поэтому после её смены его надо перезапустить,
# иначе задания продолжат ходить по старому времени до ближайшей перезагрузки.
- name: Перезапустить cron
  ansible.builtin.service:
    name: "{{ 'cron' if ansible_facts.os_family == 'Debian' else 'crond' }}"
    state: restarted
