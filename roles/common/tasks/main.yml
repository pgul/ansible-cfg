---
- name: Убедиться, что ОС поддерживается этой ролью
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Неподдерживаемая ОС: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      (os_family={{ ansible_facts.os_family }}).

- name: Обновить кеш apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Установить базовые пакеты
  ansible.builtin.package:
    name: >-
      {{ common_base_packages + common_base_packages_extra
         + (common_time_sync_packages if common_manage_time_sync | bool else []) }}
    state: present

- name: Настроить таймзону
  community.general.timezone:
    name: "{{ common_timezone }}"
  notify: Перезапустить cron

- name: Включить синхронизацию времени
  ansible.builtin.service:
    name: "{{ common_time_sync_service }}"
    state: started
    enabled: true
  when: common_manage_time_sync | bool
