---
- name: Assert the OS is supported by this role
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Unsupported OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      (os_family={{ ansible_facts.os_family }}).

- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  # Refreshing the cache is not a configuration change, but once an hour it
  # reported one and spoiled "changed=0" as the signal that a host converged.
  changed_when: false
  when: ansible_facts.os_family == 'Debian'

- name: Install base packages
  ansible.builtin.package:
    name: >-
      {{ common_base_packages + common_base_packages_extra
         + (common_time_sync_packages if common_manage_time_sync | bool else []) }}
    state: present

- name: Set the timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  notify: Restart cron

- name: Enable time synchronisation
  ansible.builtin.service:
    name: "{{ common_time_sync_service }}"
    state: started
    enabled: true
  when: common_manage_time_sync | bool
