---
# IMPORTANT, about variable precedence: everything below lives in defaults/,
# which is the LOWEST precedence in Ansible, so any host_vars/ or group_vars/
# overrides it freely. Had the OS differences lived in roles/common/vars/
# <os_family>.yml they would instead have silently overridden host_vars —
# a common and non-obvious trap. Hence the per-OS dicts rather than separate
# vars files.

# Debian and RedHat record the same zone under different names: Ubuntu keeps
# Etc/UTC, Fedora keeps UTC. A single value for everyone would make this task
# report a change on every run across half the fleet.
common_timezone_by_os:
  Debian: Etc/UTC
  RedHat: UTC
common_timezone: "{{ common_timezone_by_os[ansible_facts.os_family] }}"

common_base_packages_by_os:
  Debian:
    - ca-certificates
    - curl
    - git
    - gnupg
    - htop
    - net-tools
    - python3-apt
    - rsync
    - tmux
    - vim
  RedHat:
    - ca-certificates
    - curl
    - git
    - gnupg2
    - htop
    - net-tools
    - rsync
    - tmux
    - vim

common_base_packages: "{{ common_base_packages_by_os[ansible_facts.os_family] }}"
common_base_packages_extra: []

# Time synchronisation service. The role only enables it — it does not impose a
# particular implementation, because happy already runs ntpsec and there is no
# point ripping out a working ntpd in favour of chrony.
common_time_sync_service_by_os:
  Debian: systemd-timesyncd
  RedHat: chronyd
common_time_sync_service: "{{ common_time_sync_service_by_os[ansible_facts.os_family] }}"

# Packages that service needs. Empty where it ships as part of systemd.
common_time_sync_packages_by_os:
  Debian: []
  RedHat: [chrony]
common_time_sync_packages: "{{ common_time_sync_packages_by_os[ansible_facts.os_family] }}"

# Inside a container the clock belongs to the host: systemd-timesyncd will not
# start there (ConditionVirtualization=!container), and trying to start it
# produces a "change" that never converges. So in containers we do not manage
# time at all.
common_manage_time_sync: "{{ 'container' not in ansible_facts.virtualization_tech_guest | default([]) }}"
