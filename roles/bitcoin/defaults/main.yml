---
# The user, group, binaries and systemd units come from the .deb. This role
# owns only what a package cannot ship: the config, because it holds RPC
# credentials that differ per host.
bitcoin_manage: true

bitcoin_config: /etc/bitcoin/bitcoin.conf
bitcoin_config_owner: root
bitcoin_config_group: bitcoin
bitcoin_config_mode: "0640"

# Everyone who runs bitcoin-cli needs the same credentials, so the daemon's
# config is copied verbatim to each client's own ~/.bitcoin/bitcoin.conf.
# Copied on the host itself, never through the control machine: the passwords
# would otherwise pass through Ansible and show up in --diff output.
bitcoin_client_configs:
  - dir: "/home/{{ users_admin_name | default('gul') }}/.bitcoin"
    owner: "{{ users_admin_name | default('gul') }}"
    group: "{{ users_admin_name | default('gul') }}"
    dir_mode: "0700"
    file_mode: "0600"
  - dir: /var/lib/zabbix/.bitcoin
    owner: zabbix
    group: root
    dir_mode: "0750"
    file_mode: "0640"

# --- Only used when the config does not exist yet, i.e. on a brand new host ---
#
# On an existing host the file is left exactly as it is: its passwords are the
# ones the running daemon already accepts, and rewriting them would need a
# restart — on node that means a mainnet node with 843 GiB of chain data.
bitcoin_rpcbind: 127.0.0.1
bitcoin_rpcuser: bitcoin
bitcoin_main_rpcport: 8332
bitcoin_sections:
  - name: test
    rpcport: 18332
  - name: testnet4
    rpcport: 48332

# --- systemd drop-in for the daemon's unit ---
#
# The unit the package ships. Ubuntu's own build calls it bitcoind; the
# upstream-style package on alpha calls it bitcoin. Override in host_vars.
bitcoin_service: bitcoind
bitcoin_dropin_dir: "/etc/systemd/system/{{ bitcoin_service }}.service.d"

# Mounts the daemon must not start without. Empty means the stock unit is left
# alone. Set per host where the chain data lives on its own volume: systemd then
# refuses to start bitcoind until every listed path is mounted, instead of
# letting it come up on the empty mount point and start a fresh IBD there.
bitcoin_required_mounts: []

# TimeoutStopSec for the daemon; empty keeps the packaged value (90 s). Flushing
# the chainstate on shutdown can take minutes on a mainnet node, and the stock
# timeout would SIGKILL it half-way — set 600 on such hosts.
bitcoin_stop_timeout_sec: ""

# Hold the daemon back while the kernel's ext4lazyinit thread is still
# initialising a freshly made filesystem. It is a kernel thread, not a unit, so
# there is nothing for After= to point at: the drop-in adds an ExecStartPre that
# polls for the thread and returns as soon as it is gone (at once, if it never
# ran). On a big volume the initialisation saturates the disk for minutes, and a
# daemon reading the chain at the same time starves everything else, udev
# included. Gives up waiting after bitcoin_wait_ext4lazyinit_sec and starts the
# daemon anyway; TimeoutStartSec is raised by the same amount so systemd does not
# kill the unit while it waits.
bitcoin_wait_ext4lazyinit: false
bitcoin_wait_ext4lazyinit_sec: 3600

# Derived: whether the drop-in has anything to say.
bitcoin_dropin_wanted: >-
  {{ bitcoin_required_mounts | length > 0
     or (bitcoin_stop_timeout_sec | string | length > 0)
     or (bitcoin_wait_ext4lazyinit | bool) }}
