---
- name: Install the agent
  ansible.builtin.package:
    name: "{{ zabbix_agent_package }}"
    state: present

# Every JSON-RPC check ends in "| jq", and without it the UserParameter returns
# an error instead of a value. That was the situation on ho: jq was not
# installed and both of its checks quietly did not work.
- name: Install jq when JSON-RPC checks are configured
  ansible.builtin.package:
    name: jq
    state: present
  when: zabbix_agent_rpc_checks | length > 0

# The package creates this directory itself, but on spelik the agent wrote to
# /var/log/zabbix while logrotate rotated /var/log/zabbix-agent — so the log was
# never rotated at all. The template unifies the path, and this task guarantees
# the directory exists before the agent tries to write there.
- name: Ensure the log directory exists
  ansible.builtin.file:
    path: "{{ zabbix_agent_log_file | dirname }}"
    state: directory
    owner: zabbix
    group: zabbix
    mode: "0755"

- name: Ensure the state directory for UserParameter scripts exists
  # zbx-chain-checkpoint caches its answer here. The Debian package does not
  # create the directory on every release (cherry, Ubuntu 26.04, had none), and
  # without it every poll bisects from scratch and, with dash, reports the
  # failed redirection as the item value.
  ansible.builtin.file:
    path: /var/lib/zabbix
    state: directory
    owner: zabbix
    group: zabbix
    mode: "0750"

- name: Ensure the UserParameter directory exists
  ansible.builtin.file:
    path: "{{ zabbix_agent_include_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install UserParameter definitions
  ansible.builtin.template:
    src: custom.conf.j2
    dest: "{{ zabbix_agent_include_dir }}/custom.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart zabbix-agent

# On some hosts Include pointed at /etc/zabbix/zabbix_agentd.d. After moving to
# the shared directory the old file would linger and, if Include were ever
# pointed back, would define the same keys twice.
- name: Remove custom.conf from former include directories
  ansible.builtin.file:
    path: "{{ item }}/custom.conf"
    state: absent
  loop: "{{ zabbix_agent_stale_include_dirs }}"
  when: item != zabbix_agent_include_dir
  notify: Restart zabbix-agent

- name: Install the main config
  ansible.builtin.template:
    src: zabbix_agentd.conf.j2
    dest: "{{ zabbix_agent_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart zabbix-agent

- name: Enable and start the service
  ansible.builtin.service:
    name: "{{ zabbix_agent_service }}"
    state: started
    enabled: true
