---
# Выключается на хостах, чей конфиг слишком своеобразен для общего шаблона
# (см. host_vars/happy.yml).
zabbix_agent_manage: true

zabbix_agent_package: zabbix-agent
zabbix_agent_service: zabbix-agent
zabbix_agent_config: /etc/zabbix/zabbix_agentd.conf

# Каталог для UserParameter. Берём тот, что кладёт сам пакет Debian;
# на части хостов исторически использовался /etc/zabbix/zabbix_agentd.d.
zabbix_agent_include_dir: /etc/zabbix/zabbix_agentd.conf.d
zabbix_agent_stale_include_dirs:
  - /etc/zabbix/zabbix_agentd.d

# Кому агент отвечает на пассивные проверки. Это список доверенных адресов:
# агент сверяет IP подключающегося с результатом разрешения этих имён.
#
# Раньше сюда были вписаны ещё 213.133.164.6 (its.happy.kiev.ua) и
# 91.225.123.133 (osokorki.happy.kiev.ua). Если с них кто-то опрашивает
# агентов, вернуть адрес в этот список — и мониторинг оттуда снова заработает.
zabbix_agent_servers:
  - 127.0.0.1              # для локального zabbix_get и для хостов-серверов
  - zabbix.happy.kiev.ua   # = happy.kiev.ua, 213.133.161.33
  - zabbix.spelik.com      # = oc, 129.159.205.15

# Куда агент сам ходит за активными проверками.
zabbix_agent_servers_active:
  - zabbix.happy.kiev.ua
  - zabbix.spelik.com

# Должен совпадать с именем хоста в самом Zabbix, иначе активные проверки
# не найдут своих элементов данных.
zabbix_agent_hostname: "{{ inventory_hostname }}"

zabbix_agent_pid_file: /run/zabbix/zabbix_agentd.pid
zabbix_agent_log_file: /var/log/zabbix-agent/zabbix_agentd.log
zabbix_agent_log_file_size: 0

# --- UserParameter ---
#
# Проверки через JSON-RPC на localhost отличаются только портом, поэтому
# задаются словарём «имя: порт», а не одиннадцатью почти одинаковыми строками.
zabbix_agent_rpc_checks: {}

# Всё остальное — целиком, строкой вида «Ключ,команда».
zabbix_agent_user_parameters: []
