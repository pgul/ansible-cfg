---
# Подключение. Пользователь и ключи берутся из ~/.ssh/config; здесь только то,
# что ssh не знает.
ansible_user: gul

# sudo без пароля есть везде, поэтому пароль не спрашиваем.
# become включается в плеях (site.yml), а не глобально — см. ansible.cfg.
ansible_become_method: sudo

# --- Переменные ролей ---
# Таймзону здесь НЕ задаём: дефолт роли уже UTC, но записанный так, как его
# пишет каждая ОС (Etc/UTC на Ubuntu, UTC на Fedora). Серверы держим на UTC
# осознанно — логи с разных машин сопоставимы, и cron не выполняет задание
# дважды (или ни разу) при переводе часов.
common_base_packages_extra: []
