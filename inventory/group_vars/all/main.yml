---
# Подключение. Пользователь и ключи берутся из ~/.ssh/config; здесь только то,
# что ssh не знает.
ansible_user: gul

# sudo без пароля есть везде, поэтому пароль не спрашиваем.
# become включается в плеях (site.yml), а не глобально — см. ansible.cfg.
ansible_become_method: sudo

# --- Переменные ролей ---
common_timezone: Europe/Kyiv
common_base_packages_extra: []
