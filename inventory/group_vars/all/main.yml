---
# Connection. The user and keys come from ~/.ssh/config; only what ssh does not
# know goes here.
ansible_user: gul

# Passwordless sudo is available everywhere, so no password is requested.
# become is enabled in the plays (site.yml), not globally — see ansible.cfg.
ansible_become_method: sudo

# --- Role variables ---
# The timezone is deliberately NOT set here: the role default is already UTC,
# spelled the way each OS spells it (Etc/UTC on Ubuntu, UTC on Fedora). Servers
# are kept on UTC on purpose — logs from different machines line up, and cron
# never runs a job twice (or not at all) across a clock change.
common_base_packages_extra: []
