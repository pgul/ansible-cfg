---
# On happy time is synchronised by ntpsec (ntpd), not chrony. The common role
# respects that and merely keeps the service enabled.
common_time_sync_service: ntpd
common_time_sync_packages: [ntpsec]

# The role does not touch sudoers on happy.
#
# The reason is specific: the wheel group there contains root, gul and tiger.
# The role's shared rule "%wheel ALL=(ALL) NOPASSWD:ALL" would hand passwordless
# root to tiger as well, who does not have it today. Widening somebody else's
# access for the sake of uniformity is not what this repo is for.
#
# gul already has NOPASSWD on happy via a personal rule in /etc/sudoers (next to
# a dozen fine-grained rules for zabbix, backup and rsync), so the role would
# add nothing here except risk.
#
# If tiger is in fact supposed to have root — drop this flag and roll out the
# shared rule; if not, leave it as is.
users_manage_sudoers: false

# The role does not touch the Zabbix agent on happy either.
#
# Its config lives at the old path /etc/zabbix_agentd.conf, has no Include, and
# holds two dozen UserParameter entries (sensors, mdadm, ups, mysql, ping) plus
# SourceIP, ListenIP and StartAgents, which exist nowhere else. The shared
# template would wipe all of it. On top of that happy is itself a Zabbix server
# running 7.4, while the Ubuntu hosts run agent 7.0.
zabbix_agent_manage: false

# The firewall on happy is hand-built and stays that way.
firewall_manage: false

# MariaDB drop-ins do not work on happy either.
#
# Its /etc/my.cnf is hand-written and, unlike the stock Fedora one, has no
# "!includedir /etc/my.cnf.d" — so a file placed there is simply never read.
# Adding the include would switch on all thirteen stock drop-ins that Fedora
# ships in that directory at once (galera, spider, cracklib, encryption,
# hashicorp key management, compression providers) on a live database that also
# backs the Zabbix server. Not worth it for a mysqldump setting.
#
# To get the same effect here, add a [mysqldump] section to /etc/my.cnf by hand.
mariadb_manage: false

# udp-link goes into /usr/bin here, not /usr/local/bin as everywhere else.
# happy's PATH has no /usr/local/bin at all — not even for a login shell, where
# it is /root/.local/bin:/root/bin:/usr/lib64/ccache:/usr/local/sbin:/usr/bin:
# /bin:/usr/sbin:/sbin — so a binary placed there could only be run by absolute
# path. On the Debian hosts the .deb puts it in /usr/bin anyway, so this also
# makes the fleet consistent.
udp_link_prefix: /usr

# The bitcoin node on happy is not managed here either. Its bitcoind comes from
# Fedora's bitcoin-core package, whose unit reads /etc/sysconfig/bitcoin and
# keeps the config at /etc/bitcoin/bitcoin.conf — a different shape from the
# Ubuntu hosts, where the config is /etc/bitcoin.conf and the units are ours.
bitcoin_manage: false
