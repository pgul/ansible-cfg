---
# На happy синхронизацию времени делает ntpsec (ntpd), а не chrony.
# Роль common это уважает и просто следит, что служба включена.
common_time_sync_service: ntpd
common_time_sync_packages: [ntpsec]

# sudoers на happy роль не трогает.
#
# Причина конкретная: в группе wheel там состоят root, gul и tiger. Общее
# правило роли «%wheel ALL=(ALL) NOPASSWD:ALL» выдало бы беспарольный root
# ещё и пользователю tiger, который сейчас его не имеет. Расширять чужой
# доступ ради единообразия — не то, ради чего затевался этот репозиторий.
#
# Сам gul на happy уже имеет NOPASSWD персональным правилом в /etc/sudoers
# (там же десяток тонких правил для zabbix, backup и rsync), так что роль
# здесь ничего не добавила бы, кроме риска.
#
# Если tiger всё-таки должен иметь root — убрать этот флаг и раскатать общее
# правило; если нет — оставить как есть.
users_manage_sudoers: false
