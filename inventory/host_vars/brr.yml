---
# chrony, not systemd-timesyncd. The systemd-timesyncd package is not installed
# here at all (systemctl reports it as not-found), so the role default would try
# to start a unit that does not exist. Same on sin; node has timesyncd instead.
common_time_sync_service: chrony
common_time_sync_packages: [chrony]

zabbix_agent_rpc_checks:
  qbtc-testnet: 19556
  qbtc: 9556

zabbix_agent_user_parameters:
  - 'btc[*],bitcoin-cli $1 | jq .$2'
  - 'chain-checkpoint[*],/usr/local/bin/zbx-chain-checkpoint "$1" "$2" "$3" "$4"'
  - 'systemd-active[*],systemctl is-active --quiet -- "$1" && echo 1 || echo 0'

# --- firewall ---
firewall_zabbix_agent_sources:
  - 213.133.161.33
  - 213.133.164.6
  - 129.159.205.15
# 9555 is QBitcoin mainnet P2P and is deliberately NOT public — only the other
# nodes of the fleet reach it (the list lives in group_vars/all/firewall.yml).
# The daemon is not running here yet; the rule is in place for when it is.
firewall_restricted_tcp_ports:
  9555: "{{ firewall_qbtc_peers }}"
# Nothing else is offered to the internet: bitcoind's 8333 was never open here
# and is not opened now, and 49555 — open to everyone, with nothing behind it,
# copied over from node by hand — goes away.
firewall_tcp_ports: []
# Kept as found. Inert in practice: only systemd-resolved listens on 53, and it
# binds 127.0.0.53 and 127.0.0.54, so nothing off-host can reach it anyway.
firewall_udp_ports: [53]
# udp-link's port range. Without this the host is unreachable — every ssh
# session to it goes through the ProxyCommand.
firewall_udp_port_ranges: ['43200:44000']

# --- firewall, IPv6 ---
# brr is the only host in the fleet with a real global IPv6 address
# (2a0c:4ac1:4:2de::a on ens3, with a default route), and until now it had no
# ip6tables rules at all — every port on that address was reachable from the
# internet. The role's defaults close it: policies DROP except OUTPUT, and only
# ssh, ICMPv6 and udp-link's range open. That last one is not optional here —
# brr.spelik.com has an AAAA record, so the ProxyCommand can dial in over IPv6,
# and it inherits firewall_udp_port_ranges above.
#
# Nothing is added to the two lists below: 9555 is restricted to the fleet's own
# peers, whose addresses are v4, so it stays closed on IPv6.
firewall_v6_tcp_ports: []
firewall_v6_restricted_tcp_ports: {}

# --- mariadb ---
# Since 2026-10-10 the root fs itself is a LUKS2 volume (sda1, unlocked in the
# initrd by the luks-remote dracut module with the passphrase from us; /vs on
# sdb2 is opened with the same passphrase, handed over in /run/fscryptpwd) and
# the datadir lives on it directly, so no extra mount dependency is needed.
# /vs is kept mounted but empty.

# --- bitcoin ---
# Only the blocks live on the separate volume: /data/bitcoin/blocks is
# bind-mounted (nofail) onto /var/lib/bitcoin/blocks, the rest of the datadir is
# on the root fs. Hence the dependency is on the blocks directory, not on the
# datadir. Stop timeout as on sin: chainstate flush on mainnet takes minutes.
bitcoin_required_mounts: [/var/lib/bitcoin/blocks]
bitcoin_stop_timeout_sec: 600
# After a reboot the kernel's ext4lazyinit thread keeps /data busy for a long
# time, and bitcoind reading blocks at the same time starved the system so badly
# that udev's worker for the LUKS volume was killed and /vs never mounted.
bitcoin_wait_ext4lazyinit: true
