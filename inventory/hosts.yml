---
# Инвентарь. Имена хостов — это алиасы Ansible; реальный адрес/пользователь
# берутся из ansible_host / ansible_user (или из ~/.ssh/config, если имя совпадает
# с Host из него — тогда ansible_host можно не писать).
#
# ЗАМЕНИ заглушки ниже на свои пять серверов.
all:
  children:

    # --- Группировка по назначению: сюда вешаем "что должно быть на хосте" ---
    web:
      hosts:
        srv-web-1:
          ansible_host: 203.0.113.11
        srv-web-2:
          ansible_host: 203.0.113.12

    db:
      hosts:
        srv-db-1:
          ansible_host: 203.0.113.21

    misc:
      hosts:
        srv-misc-1:
          ansible_host: 203.0.113.31
        srv-fedora-1:
          ansible_host: 203.0.113.41

    # --- Группировка по ОС: нужна только для тех переменных, которые требуются
    # ДО сбора фактов (например, ansible_python_interpreter). Всё остальное
    # различие ОС решается внутри ролей через ansible_os_family. ---
    ubuntu:
      hosts:
        srv-web-1:
        srv-web-2:
        srv-db-1:
        srv-misc-1:

    fedora:
      hosts:
        srv-fedora-1:

    # --- Полигон: сюда добавь один хост (или VM), на котором обкатываешь роли
    # первыми. Это просто пересечение с группами выше, не отдельные машины. ---
    staging:
      hosts:
        srv-misc-1:
