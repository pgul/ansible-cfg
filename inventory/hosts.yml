---
# Host names match the Host entries in ~/.ssh/config, so ansible_host, the port
# (922), keys and ProxyCommand (udp-link) are NOT duplicated here — Ansible
# invokes the system /usr/bin/ssh, which reads ~/.ssh/config itself.
#
# Consequence: edits to the ssh config automatically apply to Ansible too, but
# a broken ssh config also breaks Ansible. The test is the same: `ssh <name>`.
all:
  hosts:
    happy:
    us:
    oc:
    ho:
    spelik:
    node:
    brr:
    sin:

  children:
    # Grouping by site — for now the only grouping grounded in fact rather than
    # guesswork. Functional groups (web/db/...) come once it is clear which
    # roles belong where.
    kiev:
      hosts:
        happy:
        us:
        oc:
        ho:

    spelik_com:
      hosts:
        spelik:
        node:
        brr:
        sin:

    # Proving ground: one host we can afford to break. Every new role is tried
    # here first (`make check HOSTS=staging`, then `make apply HOSTS=staging`).
    staging:
      hosts:
        ho:
