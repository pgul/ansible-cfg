---
# Имена совпадают с Host из ~/.ssh/config, поэтому ansible_host, порт (922),
# ключи и ProxyCommand (udp-link) НЕ дублируются здесь — Ansible вызывает
# системный /usr/bin/ssh, и тот сам читает ~/.ssh/config.
#
# Следствие: правки в ssh-конфиге автоматически действуют и на Ansible,
# но и сломанный ssh-конфиг ломает Ansible. Проверка одна и та же: `ssh <имя>`.
all:
  hosts:
    happy:
    us:
    oc:
    ho:
    spelik:
    node:

  children:
    # Группировка по площадке — пока единственная, которая опирается на факты,
    # а не на догадки. Функциональные группы (web/db/...) добавим, когда станет
    # понятно, какие роли где нужны.
    kiev:
      hosts:
        happy:
        us:
        oc:
        ho:

    spelik_com:
      hosts:
        spelik:
        node:

    # Полигон: сюда — один хост, который не жалко, все новые роли обкатываются
    # сначала на нём (`make check HOSTS=staging`, потом `make apply HOSTS=staging`).
    staging:
      hosts:
        ho:
